# SPDX-License-Identifier: Apache-2.0
# Experiment: identical to the built-in `marketplace` scenario, with EXACTLY
# ONE experimental setting changed -> failures.message_drop: 0.0 -> 0.15.
# (name and output.trace are renamed only to avoid clobbering the built-in
# scenario's trace; they are identifiers, not experimental variables.)
name: marketplace_message_drop
description: "Marketplace with 15% per-message drop, to probe fault tolerance of the negotiation protocol."

tier: 1
seed: 42

agents:
  count: 100
  brain: state-machine
  roles:
    - name: buyer
      count: 50
    - name: seller
      count: 50

layers:
  transport: in_memory
  comms: nest_native
  identity: did_key
  registry: in_memory
  auth: jwt
  trust: score_average
  payments: prepaid_credits
  coordination: contract_net
  negotiation: alternating_offers
  memory: blackboard
  privacy: noop
  datafacts: datafacts_v1

task:
  type: marketplace
  config:
    catalog_size: 200
    rounds: 10

failures:
  message_drop: 0.15   # <-- the one changed setting (baseline: 0.0)

duration: "ticks: 10000"

metrics:
  - success_rate
  - mean_latency
  - message_count

output:
  trace: ./traces/marketplace_message_drop.jsonl
